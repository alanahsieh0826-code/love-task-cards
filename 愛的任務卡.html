<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>愛的任務卡（注音版）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bpmf-huninn/index.css">
<style>
  :root {
    --ink: #3a2a26;
    --muted: #8a6f66;
    --rose: #de5161;
    --paper: #fffaf6;
    --line: #ead9d1;
    --art-w: 70mm;
    --card-w: 101mm;
    --card-h: 46.66mm;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--ink);
    background: #f4ece7;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 440px) 1fr;
    gap: 24px;
    padding: 24px;
    align-items: start;
  }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    /* stacked layout: the editor scrolls away normally so it never covers the cards */
    .layout .panel { position: static; max-height: none; }
  }

  /* ---------- editor ---------- */
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow: auto;
  }
  .panel h1 { font-size: 20px; margin: 0 0 4px; }
  .panel p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  input[type=text], textarea, select {
    font: inherit; font-size: 15px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: #fff;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 52px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #f3a9b2; border-color: transparent; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  button {
    font: inherit; font-size: 14px; cursor: pointer;
    border-radius: 999px; padding: 8px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button.primary { background: var(--rose); border-color: var(--rose); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(0.97); }
  .opts { display: flex; gap: 14px; font-size: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .task {
    border-top: 1px dashed var(--line);
    padding: 12px 0;
    display: grid; gap: 6px;
  }
  .task-head { display: flex; align-items: center; gap: 8px; }
  .task-head b {
    background: var(--rose); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 9px; flex: none;
  }
  .task-head select { flex: 1; font-size: 14px; padding: 5px 8px; }
  .task .bubble-in { font-size: 14px; }
  .task .bubble-in::placeholder { color: #c4b0a8; }

  /* ---------- sheet ---------- */
  .sheet-wrap { overflow: auto; display: grid; gap: 24px; }
  /* one A4 page = 2 columns × 6 rows */
  .sheet {
    width: 210mm; height: 297mm;
    background: #fff;
    margin: 0 auto;
    box-shadow: 0 2px 18px rgba(80, 40, 30, .12);
    display: grid;
    grid-template-columns: repeat(2, var(--card-w));
    grid-template-rows: repeat(6, var(--card-h));
    justify-content: center;
    align-content: center;
    gap: 0;
    overflow: hidden;
  }
  .card {
    display: flex;
    width: var(--card-w); height: var(--card-h);
    outline: 0.25mm dashed #b9aaa4;
    outline-offset: -0.125mm;
    background: #fef9f5;
  }
  /* left: the original illustration, untouched apart from the erased old text */
  .art { position: relative; overflow: hidden; width: var(--art-w); height: 100%; flex: none; }
  .stage {
    position: absolute; left: 0; top: 0;
    width: 1055px; height: 1491px;
    transform-origin: 0 0;
  }
  .stage img { position: absolute; left: 0; top: 0; width: 1055px; height: 1491px; display: block; user-select: none; }
  .zh {
    font-family: "Bpmf Huninn", "Microsoft JhengHei", sans-serif;
    color: #2b201d;
    white-space: pre-wrap;
    text-align: center;
    line-height: 1.22;
    letter-spacing: 1px;
  }
  .bubble {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .bubble .fit { display: block; }
  .bubble.heart { color: #c2384f; }
  /* right: the task text column */
  .side {
    flex: 1; min-width: 0;
    margin: 1.2mm 1.2mm 1.2mm 0.3mm;
    border: 0.3mm dashed #ecbcc2;
    border-radius: 2.6mm;
    background: #fffdfb;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.4mm 0.8mm 1mm;
    gap: 1mm;
  }
  .tag {
    background: #de5161;
    color: #fff;
    border-radius: 999px;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-weight: 700; font-size: 2.9mm; letter-spacing: 0.2mm;
    padding: 0.5mm 2.2mm;
    white-space: nowrap;
  }
  .tag[hidden] { display: none; }
  .task-text {
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* "inside" mode: narrower card, text written straight onto the erased empty area */
  body.inside { --card-w: var(--art-w); }
  body.inside .side { display: none; }
  .in-text, .in-tag { position: absolute; display: none; }
  body.inside .in-text { display: flex; align-items: center; justify-content: center; }
  body.inside .in-tag { display: flex; }
  .in-text .fit { display: block; white-space: pre; }
  .in-tag {
    align-items: center; justify-content: center;
    background: #de5161; color: #fff; border-radius: 999px;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-weight: 700; font-size: 21px; letter-spacing: 1px; white-space: nowrap;
  }
  body.inside .in-tag[hidden] { display: none; }
  .task-text .fit { display: block; white-space: pre; letter-spacing: 0; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .layout { display: block; padding: 0; }
    .panel { display: none; }
    .sheet-wrap { display: block; overflow: visible; }
    .sheet { box-shadow: none; margin: 0; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="panel">
    <h1>愛的任務卡</h1>
    <p class="hint">在餐廳就能當場完成的 24 個小任務。改這裡的文字，卡片會跟著更新，注音會自動加上。按「列印」會印成 2 張 A4（每張 2×6），沿虛線剪成 24 張小卡。</p>

    <div class="field">
      <label for="who">稱呼（會替換所有卡片裡的稱呼）</label>
      <input type="text" id="who" value="最愛的人" maxlength="8">
    </div>

    <div class="opts">
      <label><input type="checkbox" id="showNum" checked> 顯示任務編號</label>
    </div>
    <div class="opts" role="radiogroup" aria-label="文字位置">
      <span style="color:var(--muted)">文字位置：</span>
      <label><input type="radio" name="mode" id="modeSide" value="side"> 右側文字欄（卡片 10.1×4.7 公分）</label>
      <label><input type="radio" name="mode" id="modeInside" value="inside"> 插圖空白處（卡片 7×4.7 公分，字較大）</label>
    </div>

    <div class="row-btns">
      <button class="primary" id="printBtn">列印</button>
      <button id="resetBtn">還原預設</button>
    </div>

    <div id="tasks"></div>
  </aside>

  <main class="sheet-wrap">
    <div class="sheet"></div>
    <div class="sheet"></div>
  </main>
</div>

<script>
// ---------- illustration pool (coordinates in the 1055×1491 image) ----------
// cards-clean.jpg is the original picture with only the old task text, tags and bubble text erased.
const PICS = {
  thanks:  { name: "說謝謝（愛心）",       text: [165, 280, 352, 372], crop: [20, 252, 357, 478],   bubble: { box: [205, 388, 286, 461], heart: true } },
  kiss:    { name: "親臉頰／抱抱",         text: [848, 284, 1030, 346], crop: [702, 252, 1035, 478] },
  praise:  { name: "說優點（愛心對話）",   text: [480, 508, 684, 612], crop: [370, 490, 690, 712] },
  sing:    { name: "唱歌",                 text: [165, 746, 352, 842], crop: [20, 726, 357, 940] },
  smile:   { name: "微笑",                 text: [148, 972, 350, 1062], crop: [20, 948, 357, 1166] },
  hello:   { name: "揮手打招呼（對話框）", text: [488, 972, 684, 1022], crop: [370, 948, 690, 1166],  bubble: { box: [565, 1086, 658, 1160] } },
  share:   { name: "分享聊天",             text: [802, 972, 1032, 1046], crop: [702, 948, 1035, 1166] },
  cheer:   { name: "比讚鼓勵（對話框）",   text: [516, 1192, 684, 1280], crop: [370, 1178, 690, 1396], bubble: { box: [566, 1292, 673, 1363] } },
};

const TAG = [12, 6, 116, 46];   // tag pill, relative to the card corner

const DEFAULT_WHO = "最愛的人";
const DEFAULTS = [
  { pic: "thanks", text: "對最愛的人\n說謝謝",         bubble: "謝謝\n你" },

  { pic: "thanks", text: "對最愛的人\n說我愛你",   bubble: "我愛\n你" },
  { pic: "kiss",   text: "給最愛的人\n一個大擁抱" },
  { pic: "praise", text: "猜猜\n最愛的人\n最愛吃什麼" },

  { pic: "smile",  text: "跟最愛的人\n比賽誰先笑" },
  { pic: "share",  text: "跟最愛的人\n說一個\n開心回憶" },
  { pic: "cheer",  text: "幫最愛的人\n比一個讚",       bubble: "讚！" },
  { pic: "thanks", text: "對最愛的人\n說辛苦了",   bubble: "辛苦\n了" },
  { pic: "kiss",   text: "給最愛的人\n一個飛吻" },
  { pic: "praise", text: "誇誇\n最愛的人\n哪裡最厲害" },
  { pic: "sing",   text: "跟最愛的人\n一起唱首歌" },
  { pic: "smile",  text: "對最愛的人\n眨眨眼睛" },
  { pic: "hello",  text: "跟最愛的人\n擊掌一下",       bubble: "耶！" },
  { pic: "share",  text: "問最愛的人\n今天過得\n好不好" },
  { pic: "cheer",  text: "稱讚\n最愛的人\n今天的表現", bubble: "好\n厲害！" },
  { pic: "hello",  text: "對最愛的人\n大聲說愛你",     bubble: "愛你！" },
];
const COUNT = DEFAULTS.length;   // 24 cards
const PER_PAGE = 12;             // 2 × 6 per A4

const KEY = "love-task-cards-v4";
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.tasks) && s.tasks.length === COUNT) return s;
  } catch (e) {}
  return fresh();
}
function fresh() {
  return { who: DEFAULT_WHO, showNum: true, mode: "inside", tasks: DEFAULTS.map(t => ({ ...t, bubble: t.bubble || "" })) };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

// ---------- editor ----------
const tasksEl = document.getElementById("tasks");
const whoEl = document.getElementById("who");
const numEl = document.getElementById("showNum");

function buildEditor() {
  whoEl.value = state.who;
  numEl.checked = state.showNum;
  (state.mode === "side" ? document.getElementById("modeSide") : document.getElementById("modeInside")).checked = true;
  tasksEl.innerHTML = "";
  state.tasks.forEach((t, i) => {
    const wrap = document.createElement("div");
    wrap.className = "task";
    const opts = Object.entries(PICS).map(([k, p]) =>
      `<option value="${k}"${k === t.pic ? " selected" : ""}>${p.name}</option>`).join("");
    wrap.innerHTML = `
      <div class="task-head"><b>任務 ${i + 1}</b><select aria-label="任務 ${i + 1} 的插圖">${opts}</select></div>
      <textarea rows="2" aria-label="任務 ${i + 1} 的文字"></textarea>
      <input type="text" class="bubble-in" placeholder="對話框裡的字（可留空）" aria-label="任務 ${i + 1} 對話框文字">`;
    const sel = wrap.querySelector("select");
    const ta = wrap.querySelector("textarea");
    const bi = wrap.querySelector(".bubble-in");
    ta.value = t.text;
    bi.value = t.bubble.replace(/\n/g, "/");
    bi.style.display = PICS[t.pic].bubble ? "" : "none";
    sel.onchange = () => { t.pic = sel.value; bi.style.display = PICS[t.pic].bubble ? "" : "none"; update(i); };
    ta.oninput = () => { t.text = ta.value; update(i); };
    bi.oninput = () => { t.bubble = bi.value.replace(/\//g, "\n"); update(i); };
    tasksEl.appendChild(wrap);
  });
}

whoEl.addEventListener("change", () => {
  const next = whoEl.value.trim();
  const prev = state.who;
  if (!next) { whoEl.value = prev; return; }
  if (prev && next !== prev) {
    state.tasks.forEach(t => {
      t.text = t.text.split(prev).join(next);
      t.bubble = t.bubble.split(prev).join(next);
    });
  }
  state.who = next;
  buildEditor();
  renderAll();
});
numEl.onchange = () => { state.showNum = numEl.checked; renderAll(); };
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { state.mode = r.value; renderAll(); });
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("要把所有文字還原成預設內容嗎？")) return;
  state = fresh(); buildEditor(); renderAll();
};

// ---------- cards ----------
const sheets = document.querySelectorAll(".sheet");
const cards = [];

function place(el, [x0, y0, x1, y1]) {
  el.style.left = x0 + "px"; el.style.top = y0 + "px";
  el.style.width = (x1 - x0) + "px"; el.style.height = (y1 - y0) + "px";
}

// shrink font until text fits its box
function fit(box, text, maxPx, minPx) {
  const span = box.querySelector(".fit");
  span.textContent = text;
  let size = maxPx;
  box.style.fontSize = size + "px";
  while (size > minPx && (span.scrollWidth > box.clientWidth || span.offsetHeight > box.clientHeight)) {
    size -= 0.5;
    box.style.fontSize = size + "px";
  }
}

function update(i) {
  const t = state.tasks[i];
  const p = PICS[t.pic];
  const card = cards[i];
  const art = card.querySelector(".art");
  const stage = card.querySelector(".stage");
  const [cx0, cy0, cx1, cy1] = p.crop;
  const cw = cx1 - cx0, ch = cy1 - cy0;
  const W = art.clientWidth, H = art.clientHeight;
  const s = Math.max(W / cw, H / ch);
  const ox = cx0 + (cw - W / s) / 2, oy = cy0 + (ch - H / s) / 2;
  stage.style.transform = `scale(${s}) translate(${-ox}px, ${-oy}px)`;

  const bp = card.querySelector(".bubble");
  if (p.bubble) {
    bp.style.display = "";
    place(bp, p.bubble.box);
    bp.classList.toggle("heart", !!p.bubble.heart);
    fit(bp, t.bubble, 30, 10);
  } else {
    bp.style.display = "none";
  }

  const inside = state.mode !== "side";
  const it = card.querySelector(".in-text"), ig = card.querySelector(".in-tag");
  place(it, p.text);
  place(ig, [cx0 + TAG[0], cy0 + TAG[1], cx0 + TAG[2], cy0 + TAG[3]]);
  ig.textContent = `任務 ${i + 1}`;
  ig.hidden = !state.showNum;
  if (inside) fit(it, t.text, 40, 12);

  const tag = card.querySelector(".tag");
  tag.textContent = `任務 ${i + 1}`;
  tag.hidden = !state.showNum;

  if (!inside) fit(card.querySelector(".task-text"), t.text, 26, 8);
  save();
}

function renderAll() {
  document.body.classList.toggle("inside", state.mode !== "side"); state.tasks.forEach((_, i) => update(i)); }

for (let i = 0; i < COUNT; i++) cards.push(makeCard(sheets[Math.floor(i / PER_PAGE)]));
buildEditor();
renderAll();
document.fonts.ready.then(renderAll);
// fonts are split by character, so re-fit once more after late subsets arrive
document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", renderAll);
</script>
